[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-dedup"
dynamic = ["version"]
description = "Sound effects library duplicate finder: byte / decoded-audio / perceptual layers"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
audio-dedup = "audio_dedup.cli:main"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_dedup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]